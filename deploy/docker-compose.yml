# CallTree on a Docker host (e.g. a Proxmox LXC).
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d
#
# One service, not two: the web UI is built into the image as static files and served by the API on
# port 8080, same origin as /api. Browse it at http://<host>:8080/.
#
# Host networking is deliberate. SIP carries addresses and ports *inside* the message body (the SDP), so
# a bridge network's NAT rewrites the packets but not the payload, and you get calls that connect with no
# audio. Host networking also avoids mapping the whole RTP port range one port at a time.

services:
  calltree:
    # Override in .env if you publish to your own registry: CALLTREE_IMAGE=ghcr.io/you/calltree:latest
    image: ${CALLTREE_IMAGE:-ghcr.io/nothotscott/calltree:latest}
    # To build locally instead of pulling, comment out `image:` above and uncomment:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: calltree
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      # SQLite database, recordings, and config.json (what the settings UI writes). Back up by copying
      # this directory - it is the whole instance, and it holds the trunk password in plain text.
      - /srv/calltree/data:/data
      # Prompt WAVs. Bind-mounting them lets you change the wording without rebuilding the image;
      # drop this line to use the prompts baked in at build time.
      - /srv/calltree/prompts:/app/prompts
    healthcheck:
      # curl is installed by deploy/Dockerfile; the aspnet base image has no HTTP client of its own.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
